# Work profile: copy to machine.toml to activate.
# Niri machine.kdl.work: default 0.25, Ghostty 0.2.
[layout]
extent_presets = [0.2, 0.25, 0.3333, 0.5]

[layout.scrolling]
default_extent_fraction = 0.25

[layout.master]
default_width_fraction = 0.55

# Work-specific Chrome app windows (ported from niri).
[[window_rule]]
match.app_id = "^chrome-faolnafnngnfdaknnbpnkhgohbobgegn-Default$"
default_floating = true

[[window_rule]]
match.app_id = "^chrome-cifhbcnohmdccbgoicgdjpfamggdegmo-Default$"
default_scrolling_extent = 0.25

[[window_rule]]
match.app_id = '^com\.mitchellh\.ghostty$'
default_scrolling_extent = 0.2
