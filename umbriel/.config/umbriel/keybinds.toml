# Keybinds for Umbriel on axis
# Replicated from ~/.config/niri/keybinds.kdl (niri is the binding source of truth).
# Chords are case-insensitive. "Mod" = general.mod_key (Super on DRM).
# See: https://docs.noctalia.dev/umbriel/keybinds/ and /actions/

[keybinds]

# Hotkey overlay / cheatsheet ------------------------------------------------
# niri: Mod+Shift+Slash { show-hotkey-overlay }
"Mod+Shift+Slash" = "cheatsheet-toggle"

# Launch ---------------------------------------------------------------------
"Mod+T" = "spawn:ghostty"
"Mod+Shift+T" = "spawn:ghostty --title=floating-terminal --window-height=100 --window-width=100"
"Mod+R" = "spawn:vicinae toggle"
"Mod+D" = "spawn:nemo"
"Mod+B" = "spawn:firefox"
"Mod+S" = "spawn:bash -c \"$TERMINAL -e fish -c fe\""

# Locking --------------------------------------------------------------------
"Mod+L" = "spawn:noctalia msg session lock"

# Volume / media / brightness (usable while locked) --------------------------
"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-", allow_when_locked = true }
"XF86AudioMute"        = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute"     = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86AudioPlay"        = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioStop"        = { action = "spawn:playerctl stop", allow_when_locked = true }
"XF86AudioPrev"        = { action = "spawn:playerctl previous", allow_when_locked = true }
"XF86AudioNext"        = { action = "spawn:playerctl next", allow_when_locked = true }
"XF86MonBrightnessUp"   = { action = "spawn:brightnessctl --class=backlight set +10%", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:brightnessctl --class=backlight set 10%-", allow_when_locked = true }

# Overview -------------------------------------------------------------------
# niri: Mod+Tab { toggle-overview }  (replaces Umbriel's scratchpad-focus-next
# default on this chord, since niri's Mod+Tab is overview)
"Mod+Tab" = { action = "overview-toggle", repeat = false }
"Mod+W" = "workspace-set-layout:toggle"
"Mod+O" = "overview-toggle"

# Close ----------------------------------------------------------------------
"Mod+Q" = { action = "window-close", repeat = false }

# Focus ----------------------------------------------------------------------
"Mod+Left"  = "window-focus-left"
"Mod+Down"  = "window-focus-down"
"Mod+Up"    = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H"     = "window-focus-left"
"Mod+J"     = "window-focus-down"
"Mod+K"     = "window-focus-up"
# "Mod+L"     = "window-focus-right"

# Move (within workspace) ----------------------------------------------------
"Mod+Ctrl+Left"  = "column-move-left"
"Mod+Ctrl+Down"  = "window-move-down"
"Mod+Ctrl+Up"    = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+J"     = "window-move-down"
"Mod+Ctrl+K"     = "window-move-up"
"Mod+Apostrophe" = "column-move-right"
"Mod+Semicolon"  = "column-move-left"

# First / last column ----------------------------------------------------------
"Mod+Home"         = "column-focus-first"
"Mod+End"          = "column-focus-last"
"Mod+Ctrl+Home"    = "column-move-to-first"
"Mod+Ctrl+End"     = "column-move-to-last"

# Monitor focus ----------------------------------------------------------------
"Mod+Shift+Left"  = "output-focus-left"
"Mod+Shift+Down"  = "output-focus-down"
"Mod+Shift+Up"    = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+H"     = "output-focus-left"
"Mod+Shift+J"     = "output-focus-down"
"Mod+Shift+K"     = "output-focus-up"
"Mod+Shift+L"     = "output-focus-right"

# Move column to monitor --------------------------------------------------------
"Mod+Shift+Ctrl+Left"  = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down"  = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up"    = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+H"     = "column-move-to-output-left"
"Mod+Shift+Ctrl+J"     = "column-move-to-output-down"
"Mod+Shift+Ctrl+K"     = "column-move-to-output-up"
"Mod+Shift+Ctrl+L"     = "column-move-to-output-right"

# Workspaces --------------------------------------------------------------------
"Mod+Page_Down"  = "workspace-next"
"Mod+Page_Up"    = "workspace-previous"
"Mod+U"          = "workspace-next"
"Mod+I"          = "workspace-previous"
"Mod+Ctrl+Page_Down" = "window-move-to-workspace-next"
"Mod+Ctrl+Page_Up"   = "window-move-to-workspace-previous"
"Mod+Ctrl+U"         = "window-move-to-workspace-next"
"Mod+Ctrl+I"         = "window-move-to-workspace-previous"
"Mod+Shift+Page_Down" = "workspace-move-down"
"Mod+Shift+Page_Up"   = "workspace-move-up"
"Mod+Shift+U"         = "workspace-move-down"
"Mod+Shift+I"         = "workspace-move-up"

# Wheel / scroll ----------------------------------------------------------------
# Mirrors niri: wheel-down = focus-left / wheel-up = focus-right (Umbriel's
# defaults are inverted relative to niri, so these are swapped on purpose).
"Mod+WheelDown" = "window-focus-left"
"Mod+WheelUp"   = "window-focus-right"
"Mod+Ctrl+WheelDown" = "window-move-to-workspace-next"
"Mod+Ctrl+WheelUp"   = "window-move-to-workspace-previous"
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft"  = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft"  = "column-move-left"
# Horizontal-scroll replicates (niri: shift+wheel = column moves)
"Mod+Shift+WheelDown"      = "column-move-left"
"Mod+Shift+WheelUp"        = "column-move-right"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp"   = "column-move-left"

# Workspace numbers --------------------------------------------------------------
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Ctrl+1" = "window-move-to-workspace:1"
"Mod+Ctrl+2" = "window-move-to-workspace:2"
"Mod+Ctrl+3" = "window-move-to-workspace:3"
"Mod+Ctrl+4" = "window-move-to-workspace:4"
"Mod+Ctrl+5" = "window-move-to-workspace:5"
"Mod+Ctrl+6" = "window-move-to-workspace:6"
"Mod+Ctrl+7" = "window-move-to-workspace:7"
"Mod+Ctrl+8" = "window-move-to-workspace:8"
"Mod+Ctrl+9" = "window-move-to-workspace:9"

# Consume / expel columns -----------------------------------------------------
# niri's consume-or-expel-window-left/right split into two actions here.
"Mod+BracketLeft"  = "window-consume-left"
"Mod+BracketRight" = "window-expel-right"
"Mod+Comma"  = "window-consume-left"
"Mod+Period" = "window-expel-right"

# Size / state -----------------------------------------------------------------
"Mod+G" = "window-cycle-width"
"Mod+F" = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+C" = "column-center"
"Mod+Minus" = "window-modify-width:-0.1"
"Mod+Equal" = "window-modify-width:0.1"

# Floating -----------------------------------------------------------------------
"Mod+V" = "window-toggle-floating"
"Mod+Shift+V" = "window-focus-switch-floating"

# Screenshots ---------------------------------------------------------------------
"Print" = "spawn:flameshot gui --clipboard"
"Ctrl+Print" = "spawn:flameshot screen --path ~/Pictures/Screenshots"
"Shift+Print" = "spawn:flameshot gui --clipboard"

# Quit / power --------------------------------------------------------------------
"Mod+Shift+E" = "session-quit"
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+P" = "dpms-off"

# Keychron special keys -------------------------------------------------------------
# F13 = XF86Tools
"XF86Tools" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-"
# F14 = XF86Launch5
"XF86Launch5" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+"
# F15 = XF86Calculator
"XF86Calculator" = "spawn:gnome-calculator"

# Umbriel / Noctalia extras (kept from the prior stub) ------------------------------
# "Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+P" = "window-toggle-pinned"
"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"

# NOT replicated (no Umbriel equivalent / no-op in niri):
#   Mod+Shift+R / Mod+Ctrl+R / Mod+Shift+Minus / Mod+Shift+Equal  (window-height actions)
#   Mod+Ctrl+F   (expand-column-to-available-width)
#   Mod+Ctrl+C   (center-visible-columns)
#   Mod+Escape   (toggle-keyboard-shortcuts-inhibit)
#   XF86Launch6/7/8 (spawn "" no-ops)