# Umbriel default config
# Copy this file to ~/.config/umbriel/config.toml to customize it.
# Changes apply on save. See docs/user/ for the full reference.
#
# [include] merges extra files into this one. Included files are parsed first,
# in list order (later files override earlier ones), then everything in this
# file overrides all of them. That is why Noctalia's dynamic theming can render
# its palette into a separate noctalia.toml and still let you override the
# generated colors here.

[include]
files = [
    "keybinds.toml",
    "window_rules.toml",
    "input.toml",
    "output.toml",
    "noctalia.toml",
]

[general]
autostart = []
# mod_key = "Super"            # Mod in keybinds; defaults to Super (Alt when nested)
xwayland = true                # requires restart to change
show_cheatsheet = true         # show keybinds overlay on startup
focus_on_activate = false      # activation requests mark urgent without stealing focus
honor_restored_maximize = false # let apps restore their saved maximized state

# [environment]
# GTK_THEME = "Adwaita:dark"
# QT_QPA_PLATFORMTHEME = "qt5ct"

[workspaces]
back_and_forth = false

# Colors ---------------------------------------------------------------------

[colors]
# background = "#141419F0"
# text_primary = "#E8E8EAFF"
# text_muted = "#8A8A92FF"
# accent_primary = "#7AA3FFFF"
# accent_secondary = "#F5C96BFF"
# warning = "#F5C96BFF"
# error = "#FF6B6BFF"

# Animation ------------------------------------------------------------------

[animation]
enabled = true
duration_ms = 250              # 1-10000
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 150
curve = "easeout"
style = "popin"                # popin, zoom, slide, fade, none
scale = 0.85                   # 0.1-1.0, used by popin

[animation.windows_out]
enabled = true
duration_ms = 150
curve = "easeout"
style = "fade"                 # fade, slide

[animation.windows_move]
enabled = true
duration_ms = 250
curve = "snappy"

[animation.workspaces]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.5                      # 0.0-1.0
blur = false
scale = 0.0                    # 0 preserves the window geometry
maximize = false
fullscreen = false

[animation.border]
enabled = false
duration_ms = 250
curve = "easeout"

[animation.dim_unfocused]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.0                      # 0.0-1.0

[animation.layers]
enabled = false
duration_ms = 250
curve = "easeout"

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 2               # 0-100
outer_border_width = 0         # 0-100
corner_radius = 10             # 0-100
drag_opacity = 0.75
# border_focused = "#7AA3FFFF"
# border_unfocused = "#292933FF"
# scratchpad_border_focused = "#E5C07BFF"
# scratchpad_border_unfocused = "#5C4A2AFF"
# outer_border_color = "#1A1A1FFF"
# insert_hint_color = "#7FC8FF80"
# backdrop_color = "#000000FF"

[appearance.blur]
enabled = true
optimized = true
passes = 3                     # 0-8
radius = 3                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 0.9               # 0.0-2.0
contrast = 0.9                 # 0.0-2.0
saturation = 1.1               # 0.0-2.0

[appearance.shadow]
enabled = true
softness = 10                  # 0-200, 0 = hard edge
offset_x = 2                   # -200 to 200
offset_y = 2
color = "#0000007F"

# Overview -------------------------------------------------------------------

[overview]
zoom = 0.5                     # 0.1-0.75
# background_blur = true        # blur the wallpaper while the overview is open
# background_tint = "#10101430"
# workspace_background = "#00000044" # set alpha to FF for an opaque background

# Hot corners ---------------------------------------------------------------

# [hot_corners.top_left]
# enabled = true
# delay_ms = 500                # 0-10000, 0 activates immediately
# action = "overview-open"

# [hot_corners.top_right]
# enabled = false
# delay_ms = 500
# action = "overview-close"

# [hot_corners.bottom_left]
# enabled = false
# delay_ms = 500
# action = "overview-toggle"

# [hot_corners.bottom_right]
# enabled = false
# delay_ms = 500
# action = "spawn:notify-send 'Bottom right'"

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"             # "scrolling", "dwindle", or "master"
gap = 8                        # 0-500
width_presets = [0.333, 0.5, 0.667] # shared by scrolling, dwindle, and master

[layout.scrolling]
# Vertical workspaces stack horizontal lanes from top to bottom.
# direction = "horizontal"
default_width_fraction = 0.5  # remove to let clients choose their initial width
center_underfull_strip = true  # center the strip whenever it is narrower than the viewport

[layout.master]
position = "left"              # "left" or "right"
default_width_fraction = 0.55  # 0.1-0.9

# Workspace layout overrides (see docs/user/outputs.md#workspace-rules)
# [[workspace]]
