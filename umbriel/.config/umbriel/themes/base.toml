# Base look-and-feel layer (Umbriel).
#
# Layering model (see config.toml header for include semantics):
#   themes/base.toml  <  keybinds/input/output/window_rules  <  machine.toml
#   <  [include.optional]: noctalia.toml, then theme.toml.
# theme.toml is a LOCAL, gitignored file; create it by copying a theme:
#   cp themes/omarchy.toml theme.toml   # enable Omarchy look-and-feel
#   rm theme.toml                       # back to this base layer
# Put any personal non-theme overrides in config.toml itself (it wins over all
# includes). This file holds exactly the values that lived in config.toml before
# the theme layer was added — it exists so theme.toml can override them.

# Animation ------------------------------------------------------------------

[animation]
enabled = true
duration_ms = 250              # 1-10000
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 150
curve = "easeout"              # linear, ease, easeout, snappy, bounce, or elastic
style = "slide"                # popin, zoom, slide, fade, none
scale = 0.85                   # 0.1-1.0, used by popin

[animation.windows_out]
enabled = true
duration_ms = 150
curve = "easeout"
style = "fade"                 # fade, slide

[animation.windows_move]
enabled = true
duration_ms = 250
curve = "snappy"

[animation.workspaces]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.5                      # 0.0-1.0
blur = false
scale = 0.0                    # 0 preserves the window geometry
maximize = false
fullscreen = false

[animation.border]
enabled = false
duration_ms = 250
curve = "easeout"

[animation.dim_unfocused]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.0                      # 0.0-1.0

[animation.layers]
enabled = false
duration_ms = 250
curve = "easeout"

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 2               # 0-100
outer_border_width = 0         # 0-100
corner_radius = 10             # 0-100
drag_opacity = 0.75
# border_focused = "#7AA3FFFF"
# border_unfocused = "#292933FF"
# scratchpad_border_focused = "#E5C07BFF"
# scratchpad_border_unfocused = "#5C4A2AFF"
# outer_border_color = "#1A1A1FFF"
# insert_hint_color = "#7FC8FF80"
# backdrop_color = "#000000FF"

[appearance.blur]
enabled = true
optimized = true
passes = 3                     # 0-8
radius = 3                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 0.9               # 0.0-2.0
contrast = 0.9                 # 0.0-2.0
saturation = 1.1               # 0.0-2.0

# [appearance.shadow]
# enabled = true
# softness = 10                  # 0-200, 0 = hard edge
# offset_x = 2                   # -200 to 200
# offset_y = 2
# color = "#0000007F"

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"             # "scrolling", "dwindle", or "master"
gap = 8                        # 0-500
#extent_presets = [0.333, 0.5, 0.667] # shared by scrolling, dwindle, and master

[layout.scrolling]
# Vertical workspaces stack horizontal lanes from top to bottom.
# direction = "horizontal"
#default_width_fraction = 0.25  # remove to let clients choose their initial width
center_underfull_strip = true  # center the strip whenever it is narrower than the viewport

[layout.master]
position = "left"              # "left" or "right"
#default_width_fraction = 0.55  # 0.1-0.9
