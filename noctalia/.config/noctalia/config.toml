config_version = 8

[location]
address = "hooksett, nh"

[shell]
app_icon_color = "secondary"
app_icon_colorize = true
settings_show_advanced = true
font_family = "Inter"

[bar.default]
background_opacity = 0.6
end = [
    "sysmon",
    "spacer_2",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "clock",
    "widget"
]
font_family = "Inter"
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "wallhaven" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 3600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 14400.0
    
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 828.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.5
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

[widget.network]
show_label = false

    [widget.network.actions]
    right = "none"

[wallpaper]
directory = "/home/joe/.local/share/wallpapers"
    

[plugin_settings."yuuto/arch-updater"]
aur_helper = "yay"
auto_check_hours = 4
terminal = "ghostty"
show_activity_graph = true

[plugins]
enabled = [ "noctalia/wallhaven", "yuuto/arch-updater" ]

[widget.spacer_2]
length = 60
type = "spacer"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
hide_on_empty = true
type = "yuuto/arch-updater:widget"

[widget.control-center]
color = "primary"

[widget.tray]
drawer = true
