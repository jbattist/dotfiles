# MangoWM config aligned with Joe's niri workflow.
# Reference docs:
#   https://mangowm.github.io/docs/configuration/basics
#   https://mangowm.github.io/docs/window-management/layouts
#   https://mangowm.github.io/docs/window-management/rules

# ----- Monitor / environment -----
# niri home profile: single ultrawide on DP-1, scale 1, normal transform, origin.
# Current axis.home display is DP-3 (4K OLED); DP-1 kept for the old ultrawide/home profile.
monitorrule=name:^DP-3$,width:3840,height:2160,refresh:240,x:0,y:0,scale:1.5,rr:0
monitorrule=name:^DP-1$,x:0,y:0,scale:1,rr:0

env=XCURSOR_SIZE,24
env=HYPRCURSOR_SIZE,24
env=QT_QPA_PLATFORMTHEME,kde
env=QT_QPA_PLATFORMTHEME_QT6,kde
env=TERMINAL,ghostty

# ----- Window effects / visuals -----
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# niri shadows are configured but off by default; keep Mango shadows off too.
shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=30
shadows_blur=30
shadows_position_x=0
shadows_position_y=5

# niri window-rule: geometry-corner-radius 12 and focus-ring width 3.
border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
borderpx=3

# ----- Animations -----
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
# niri's strip is horizontal; keep tag animation horizontal.
tag_animation_direction=0
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=250
animation_duration_tag=250
animation_duration_close=220
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# ----- Scroller layout: closest Mango equivalent to niri columns -----
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=0
scroller_default_proportion_single=0.5
scroller_proportion_preset=0.3333,0.5,0.6

# Master-stack fallback settings.
new_is_master=1
default_mfact=0.5
default_nmaster=1
smartgaps=0

# Overview: niri disables hot corners; use explicit Mod+Tab instead.
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=10
overviewgappo=10

# ----- Misc / focus behavior -----
no_border_when_single=0
axis_bind_apply_timeout=150
axis_scroll_factor=1.0
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=0
warpcursor=0
focus_cross_monitor=0
exchange_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
view_current_to_back=1
allow_shortcuts_inhibit=1

# ----- Input -----
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

mouse_natural_scrolling=0
mouse_accel_speed=0.2

# ----- Tags: niri-like dynamic workspaces approximated with Mango tags -----
# layout support: tile, scroller, grid, deck, monocle, center_tile, vertical_tile, right_tile, vertical_scroller, vertical_grid, vertical_deck, tgmix
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
circle_layout=scroller,tile,monocle,grid,deck

# ----- Key bindings -----
# key names from `wev`; modifier names: super, ctrl, alt, shift, none.

# Reload config
bind=SUPER+SHIFT,r,reload_config

# Launchers and session controls from niri
bind=SUPER,t,spawn,ghostty
bind=SUPER+SHIFT,t,spawn,ghostty --title=floating-terminal --window-height=100 --window-width=100
bind=SUPER,r,spawn,vicinae toggle
bind=SUPER,d,spawn,nemo
bind=SUPER,b,spawn,firefox
bind=SUPER+ALT,l,spawn,swaylock
bind=SUPER+ALT,s,spawn,pkill orca || exec orca
bind=SUPER,q,killclient
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit
bind=SUPER+SHIFT,p,disable_monitor,DP-1

# Overview
bind=SUPER,Tab,toggleoverview

# Focus navigation: arrows plus H/J/K/L
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Home,focusstack,first
bind=SUPER,End,focusstack,last

# Move/swap windows in niri's Mod+Ctrl shape
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down
# Size-focused shortcuts Joe asked for while testing scroller.
bind=SUPER,apostrophe,set_proportion,+0.1
bind=SUPER,semicolon,set_proportion,-0.1

# Monitor focus / move-to-monitor binds
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,l,tagmon,right
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,j,tagmon,down

# Tag/workspace binds: SUPER to view, SUPER+CTRL to move focused client
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# Previous/next tag approximations for niri's workspace up/down binds
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER,i,viewtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0

# Scroller sizing and window states
bind=SUPER,g,switch_proportion_preset,
# Mango has no direct equivalent for niri Mod+Shift+R window-height preset.
bind=SUPER+CTRL,r,set_proportion,0.5
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER,c,togglemaximizescreen
bind=SUPER+CTRL,c,toggleoverview
bind=SUPER,minus,set_proportion,-0.1
bind=SUPER,equal,set_proportion,+0.1
bind=SUPER,v,togglefloating,
bind=SUPER+SHIFT,v,toggleoverlay,
bind=SUPER,w,switch_layout
# Keep the upstream/default mnemonic too while testing.
bind=SUPER,n,switch_layout
bind=SUPER,bracketleft,set_proportion,-0.1
bind=SUPER,bracketright,set_proportion,+0.1
bind=SUPER,comma,focusdir,left
bind=SUPER,period,focusdir,right

# Screenshots from niri
bind=NONE,Print,spawn,flameshot gui --clipboard
bind=CTRL,Print,spawn,flameshot screen --path ~/Pictures/Screenshots
bind=SHIFT,Print,spawn,flameshot gui --clipboard

# Audio/media/brightness from niri
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# Keychron special keys and fuzzy finder
bind=NONE,XF86Tools,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind=NONE,XF86Launch5,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bind=NONE,XF86Calculator,spawn,gnome-calculator
bind=SUPER,s,spawn,$TERMINAL -e fish -c fe

# Mouse / axis bindings. Wheel directions mirror niri-style wheel navigation.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# Mango currently rejects NONE+btn_left; use Super+Tab for overview.
mousebind=NONE,btn_middle,togglemaximizescreen,0
# Mango currently rejects NONE+btn_right; use Super+Q to close.
# niri: Mod+WheelScrollDown/Left focuses the column to the left;
#       Mod+WheelScrollUp/Right focuses the column to the right.
axisbind=SUPER,DOWN,focusdir,left
axisbind=SUPER,UP,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER+CTRL,DOWN,tagtoleft
axisbind=SUPER+CTRL,UP,tagtoright

# ----- Rules -----
# Layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# niri-like window rules and old Mango useful behavior
windowrule=ignore_maximize:1,appid:.*
windowrule=allow_csd:0,appid:.*
windowrule=appid:wezterm,scroller_proportion:0.333
windowrule=appid:firefox$,title:^Picture-in-Picture$,isfloating:1
windowrule=appid:com.mitchellh.ghostty,title:floating-terminal,isfloating:1,width:840,height:800,scroller_proportion:0.3333
windowrule=appid:com.mitchellh.ghostty,scroller_proportion:0.3333
windowrule=appid:pavucontrol$,isfloating:1
windowrule=appid:org.gnome.Calculator$,isfloating:1

# ----- Autostart -----
exec-once=qs -c noctalia-shell
exec-once=vicinae server

# This sources the noctalia theme.

# This sources the noctalia theme



source=~/.config/mango/noctalia.conf
