# Ghostty-equivalent terminal profile
font_family JetBrainsMono Nerd Font Mono
font_size 11.0

background_opacity 0.90

# Permit normal terminal clipboard reads and writes.
clipboard_control write-clipboard read-clipboard write-primary read-primary

# Match the single-tab behavior used by WezTerm.
tab_bar_min_tabs 2
tab_bar_edge top

include themes/noctalia.conf
