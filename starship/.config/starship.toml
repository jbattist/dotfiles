# ============================================================================
# USER CONFIGURATION
# ============================================================================
[username]
show_always = true
style_user = "bg:os_section_bg fg:text_light"
format = '[ $user]($style)'

[hostname]
ssh_only = false
disabled = false
style = "bg:os_section_bg fg:text_light"
format = '[@$hostname $ssh_symbol]($style)'
ssh_symbol = " "
# detect_env_vars = ["SSH_CONNECTION"]


# ============================================================================
# DIRECTORY CONFIGURATION
# ============================================================================
[directory]
style = "fg:text_dark bg:dir_section_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ============================================================================
# GIT CONFIGURATION
# ============================================================================
[git_branch]
symbol = ""
style = "bg:git_section_bg"
format = '[[ $symbol $branch ](fg:text_dark bg:git_section_bg)]($style)'

[git_status]
style = "bg:git_section_bg"
format = '[[($all_status$ahead_behind )](fg:text_dark bg:git_section_bg)]($style)'

# ============================================================================
# LANGUAGE CONFIGURATION
# ============================================================================
[c]
symbol = " "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_dark bg:lang_section_bg)]($style)'

[cpp]
symbol = " "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_dark bg:lang_section_bg)]($style)'

[rust]
symbol = "󱘗 "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_light bg:lang_section_bg)]($style)'

[python]
symbol = " "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_dark bg:lang_section_bg)]($style)'

[nodejs]
symbol = " "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_dark bg:lang_section_bg)]($style)'

[golang]
symbol = " "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_dark bg:lang_section_bg)]($style)'

[php]
symbol = " "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_dark bg:lang_section_bg)]($style)'

[java]
symbol = " "
style = "bg:lang_section_bg"
format = '[[ $symbol( $version) ](fg:text_dark bg:lang_section_bg)]($style)'


# ============================================================================
# DOCKER/CONTAINER CONFIGURATION
# ============================================================================
[docker_context]
symbol = " "
style = "bg:docker_section_bg"
format = '[[ $symbol( $context) ](fg:text_light bg:docker_section_bg)]($style)'

[container]
symbol = " "
# symbol = "󰏗 "
style = "bg:docker_section_bg"
format = '[[ $symbol( $name) ](fg:text_light bg:docker_section_bg)]($style)'

# ============================================================================
# TIME CONFIGURATION
# ============================================================================
[time]
disabled = false
time_format = "%R"
style = "bg:time_section_bg"
format = '[[  $time ](fg:text_time bg:time_section_bg)]($style)'

# ============================================================================
# PROMPT CONFIGURATION
# ============================================================================
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:success_fg)'
error_symbol = '[](bold fg:error_fg)'

