"$schema" = 'https://starship.rs/config-schema.json'

# Merged starship configuration with all three themes
# Colors are named by their usage position in the prompt
# Theme selection: change 'palette' value to desired theme:
#   - catppuccin_mocha (default)
#   - gruvbox_dark
#   - tokyo_night

# Color naming convention:
# - os_section_bg: background for OS/username section
# - dir_section_bg: background for directory section
# - git_section_bg: background for git branch/status section
# - lang_section_bg: background for language/tool section
# - docker_section_bg: background for docker/container section
# - time_section_bg: background for time section
# - text_light: light foreground text in sections
# - text_dark: dark foreground text for contrast
# - success_fg: success indicator color
# - error_fg: error indicator color

# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

format = """
[](os_section_bg)\
$os\
$username\
$hostname\
[](bg:dir_section_bg fg:os_section_bg)\
$directory\
[](fg:dir_section_bg bg:git_section_bg)\
$git_branch\
$git_status\
[](fg:git_section_bg bg:lang_section_bg)\
$c\
$rust\
$python\
[](fg:lang_section_bg bg:docker_section_bg)\
$docker_context\
$container\
[](fg:docker_section_bg bg:time_section_bg)\
$time\
[ ](fg:time_section_bg)\
$line_break$character"""

palette = 'noctalia'
